[package]
name = "logic_sim"
version = "0.1.0"
edition = "2024"
# `cargo run` (no --bin) launches the integrated app: project picker ->
# chip viewer, in one window. `cargo run --bin viewer` / `--bin demo` are
# still available for the standalone/headless-friendly entry points.
default-run = "app"

[dependencies]
# fast (pseudo-)random number gen
fastrand = "2"
# serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# logger
flexi_logger = "0.31"
log = "0.4"
# for math
glam = { version = "0.33.6", features = ["f64"] }
# cross platform directory access
dirs = "7.0.0"
# ---- rendering (wgpu + wgsl) ----
wgpu = "22"
# low level byte manipulation
bytemuck = { version = "1", features = ["derive"] }
# minimal async executor
pollster = "0.3"
# Cross-platform windowhandler
winit = "0.30"
# text renderin all-in-one
glyphon = "0.6"
# low level audio driver
cpal = "0.18.2"
# rtkit client for the audio worker's SCHED_FIFO promotion, pure Rust, no dbus system headers.
zbus = "5"
# System clipboard access (`viewer::popups::rom_copy`/`rom_paste`).
arboard = "3"

logic_sim_macros = { path = "logic_sim_macros" }

[lib]
name = "logic_sim"
path = "src/lib.rs"

[[bin]]
name = "app"
path = "src/bin/app.rs"

# ---- release build: speed first, size second ----
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

